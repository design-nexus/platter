[package]
name = "platter"
version = "0.1.0"
rust-version = "1.88"
edition = "2021"
description = "Platter — Terminal disk manager for Linux, with Omarchy themes and fstab network shares"
readme = "README.md"
license = "MIT"

repository = "https://github.com/design-nexus/platter"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
notify = "8"
ratatui = { version = "=0.30.2", features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
